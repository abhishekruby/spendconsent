<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
<title id="title">SpendConsent proposed system architecture</title><desc id="desc">A buyer uses React. Django owns catalog validation, purchase approval and payment state in PostgreSQL. Ollama can only propose catalog actions. PayPal sandbox receives human checkout approval and server-controlled payment requests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#47617b"/></marker></defs>
<rect width="1160" height="760" fill="#f5f7fa"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182b40">
<text x="40" y="46" font-size="27" font-weight="700">SpendConsent · system architecture</text>
<text x="40" y="78" font-size="15" fill="#52657a">AI proposes. The buyer approves. Django enforces. PayPal processes.</text>
<rect x="26" y="110" width="1108" height="438" rx="18" fill="#ffffff" stroke="#c6d1dd" stroke-width="1.5"/>
<text x="48" y="139" font-size="12" font-weight="700" letter-spacing="1" fill="#52657a">LOCAL LAPTOP · PROPOSED DESIGN</text>
<rect x="50" y="170" width="184" height="130" rx="12" fill="#f0f4f8" stroke="#b8c8d8"/>
<text x="68" y="202" font-size="18" font-weight="700">Buyer</text>
<text x="68" y="231" font-size="13" fill="#445a70">Needs and budget</text>
<text x="68" y="254" font-size="13" fill="#445a70">Review exact purchase</text>
<text x="68" y="277" font-size="13" fill="#445a70">Explicit approval</text>
<rect x="274" y="170" width="226" height="130" rx="12" fill="#f0f4f8" stroke="#b8c8d8"/>
<text x="292" y="202" font-size="18" font-weight="700">React + TypeScript</text>
<text x="292" y="231" font-size="13" fill="#445a70">Request and comparison</text>
<text x="292" y="254" font-size="13" fill="#445a70">Review / payment status</text>
<text x="292" y="277" font-size="13" fill="#445a70">Vite · same-origin API</text>
<rect x="542" y="160" width="280" height="152" rx="12" fill="#e9f2ff" stroke="#779bc5"/>
<text x="560" y="192" font-size="18" font-weight="700">Django + DRF</text>
<text x="560" y="221" font-size="13" fill="#445a70">Catalog and exact totals</text>
<text x="560" y="244" font-size="13" fill="#445a70">Approval / stock / retry state</text>
<text x="560" y="267" font-size="13" fill="#445a70">Server-only PayPal client</text>
<rect x="866" y="170" width="232" height="130" rx="12" fill="#f0f4f8" stroke="#b8c8d8"/>
<text x="884" y="202" font-size="18" font-weight="700">PostgreSQL</text>
<text x="884" y="231" font-size="13" fill="#445a70">Requests and offers</text>
<text x="884" y="254" font-size="13" fill="#445a70">Immutable review records</text>
<text x="884" y="277" font-size="13" fill="#445a70">Approvals and attempts</text>
<rect x="542" y="366" width="280" height="130" rx="12" fill="#edf7f0" stroke="#91b69b"/>
<text x="560" y="398" font-size="18" font-weight="700">Ollama / Qwen</text>
<text x="560" y="427" font-size="13" fill="#445a70">Local inference · bounded tools</text>
<text x="560" y="450" font-size="13" fill="#445a70">Catalog proposals only</text>
<text x="560" y="473" font-size="13" fill="#445a70">No payment or approval tool</text>
<rect x="542" y="582" width="280" height="112" rx="12" fill="#eaf2ff" stroke="#779bc5"/>
<text x="560" y="614" font-size="18" font-weight="700">PayPal sandbox</text>
<text x="560" y="643" font-size="13" fill="#445a70">Normal buyer checkout</text>
<text x="560" y="666" font-size="13" fill="#445a70">Server-verified payment</text>
<path d="M234 235 H274" fill="none" stroke="#47617b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 235 H542" fill="none" stroke="#47617b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M822 235 H866" fill="none" stroke="#47617b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M682 312 V366" fill="none" stroke="#47617b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="696" y="344" font-size="12" fill="#52657a">tool calls + results</text>
<path d="M822 282 H842 V638 H822" fill="none" stroke="#47617b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="862" y="404" font-size="13" fill="#445a70">Django controls create,</text><text x="862" y="426" font-size="13" fill="#445a70">capture and verification.</text><text x="862" y="460" font-size="12" fill="#52657a">Secrets stay on the server.</text>
<path d="M460 300 V322 H512 V638 H542" fill="none" stroke="#47617b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="60" y="584" font-size="14" font-weight="700">Human PayPal approval</text><text x="60" y="607" font-size="12" fill="#52657a">The browser SDK opens checkout.</text>
<text x="52" y="403" font-size="15" font-weight="700">Exact purchase boundary</text><text x="52" y="430" font-size="13" fill="#445a70">Changed item, price or terms require review.</text><text x="52" y="454" font-size="13" fill="#445a70">Timeout means unresolved, not a second purchase.</text><text x="52" y="478" font-size="13" fill="#445a70">Stock and quote holds survive uncertain outcomes.</text>
<text x="40" y="731" font-size="12" fill="#52657a">Design v1.0 · 16 October 2026 · One sample merchant · Sandbox only · Model feasibility unverified</text>
